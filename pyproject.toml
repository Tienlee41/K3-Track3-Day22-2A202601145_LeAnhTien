[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preference-alignment-lab-starter"
version = "0.1.0"
description = "Production-style skeleton for DPO/ORPO preference alignment lab"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "typer>=0.12", "rich>=13.7", "pyyaml>=6.0", "numpy>=1.26"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0", "openai>=1.30"]
train = [
  "torch>=2.7",
  "transformers>=4.44,<5",
  "datasets>=2.20",
  "trl>=0.12,<0.27",
  "peft>=0.12",
  "bitsandbytes>=0.47",
  "accelerate>=1.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "matplotlib>=3.9",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "huggingface-hub>=0.34",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "gguf==0.19.0",
]
[project.scripts]
pref-lab = "preference_lab.cli:app"
[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.setuptools.packages.find]
where = ["src"]

