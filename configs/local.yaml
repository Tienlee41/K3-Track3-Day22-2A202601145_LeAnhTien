seed: 42
paths:
  train_data: data/sample_preferences.jsonl
  output_dir: outputs
training:
  method: dpo  # dpo | orpo | mock
  beta: 0.1
  lambda_orpo: 0.1
  max_length: 512
  batch_size: 2
evaluation:
  validation_ratio: 0.2
  scorer: local  # no API key or model download required
  regression_prompts: docs/regression_prompts.md
